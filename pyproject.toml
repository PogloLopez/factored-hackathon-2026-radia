[project]
name = "factored-hackathon-2026-radia"
version = "0.1.0"
description = "Radia. Sistema de atención AI-first para productos de crédito (Factored AI & Data Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "radia"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
