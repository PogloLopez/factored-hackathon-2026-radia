[project]
name = "factored-hackathon-2026-radia"
version = "0.1.0"
description = "Radia. Sistema de atención AI-first para productos de crédito (Factored AI & Data Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.104",
    "duckdb>=1.5.6",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
radia-etl = "radia.etl.cli:app"
radia-eval = "radia.eval.cli:app"

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "radia"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
